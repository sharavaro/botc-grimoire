<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood on the Clocktower</title>
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#0e0c15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clocktower">
<link rel="icon" type="image/png" sizes="192x192" href="icons/app-192.png">
<link rel="apple-touch-icon" href="icons/app-apple-180.png">
<script>
  // A link with a room code (the QR code) is always for a player: go straight to the player app.
  (function(){ var q = location.search || ''; if(/[?&]room=/.test(q)) location.replace('player.html' + q + location.hash); })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0c15;--panel:#1b1726;--line:#3a3350;--gold:#c9a227;--goldb:#e6c65c;--mist:#9a92ac;--text:#ece3cc;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 18%,#2a2040 0%,var(--bg) 62%) fixed;color:var(--text);font-family:'Noto Naskh Arabic',Georgia,serif;}
  main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px 34px;gap:14px;max-width:460px;margin:0 auto;}
  .logo{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 40px rgba(246,198,79,.18);}
  h1{font-family:'Cinzel Decorative',serif;color:var(--goldb);font-size:clamp(24px,7vw,32px);margin:6px 0 0;text-align:center;line-height:1.2;direction:ltr;}
  .q{color:var(--mist);margin:2px 0 14px;font-size:18px;text-align:center;}
  .q span{display:block;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.12em;direction:ltr;margin-top:2px;}
  a.choice{display:flex;align-items:center;gap:16px;width:100%;text-decoration:none;color:var(--text);background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:18px 18px;transition:border-color .15s,transform .1s;}
  a.choice:hover,a.choice:focus-visible{border-color:var(--gold);outline:none;}
  a.choice:active{transform:scale(.985);}
  .ic{font-size:40px;width:56px;text-align:center;flex:none;}
  .tx b{display:block;font-size:24px;line-height:1.25;}
  .tx i{display:block;font-style:normal;font-family:'Cinzel',serif;color:var(--goldb);font-size:14px;letter-spacing:.1em;direction:ltr;text-align:right;}
  .tx small{display:block;color:var(--mist);font-size:14px;margin-top:4px;}
  a.st{border-color:#5c4508;background:linear-gradient(180deg,#2a2110,#1b1726);}
</style>
</head>
<body>
<main>
  <img class="logo" src="icons/app-192.png" alt="">
  <h1>Blood on the Clocktower</h1>
  <div class="q">من أنت في هذه اللعبة؟<span>WHO ARE YOU TONIGHT?</span></div>
  <a class="choice pl" href="player.html">
    <span class="ic">🙂</span>
    <span class="tx"><b>لاعب</b><i>PLAYER</i><small>انضم إلى اللعبة برمز الغرفة من الراوي</small></span>
  </a>
  <a class="choice st" href="grimoire.html">
    <span class="ic">🎭</span>
    <span class="tx"><b>الراوي</b><i>STORYTELLER</i><small>أدر اللعبة من كتاب الراوي</small></span>
  </a>
</main>
</body>
</html>
